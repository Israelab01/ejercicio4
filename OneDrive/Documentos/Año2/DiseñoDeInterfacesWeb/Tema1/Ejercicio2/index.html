<!DOCTYPE html>
<html>
<head>
    <title>Tabla de Etiquetas HTML</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 1px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Tabla de Etiquetas HTML</h2>

<table>
  <tr>
    <th>Categoría</th>
    <th>Etiquetas</th>
  </tr>
  <tr>
    <td>Formulario</td>
    <td>form, button, input, select, textarea</td>
  </tr>
  <tr>
    <td>Tabla</td>
    <td>table, tr, th, td, caption</td>
  </tr>
  <tr>
    <td>Texto</td>
    <td>b, em, i, strong, sub, sup</td>
  </tr>
</table>

</body>
</html>
